# Cloudflare deploys this on every push to GitHub (Workers Builds).
# The website files in public/ are served as static assets;
# requests to /api/states go to src/worker.js.
name = "planes-above-me"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
