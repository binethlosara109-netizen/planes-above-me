# Cloudflare deploys this on every push to GitHub (Workers Builds).
# The website files in public/ are served as static assets;
# /api/* and /over/* go to src/worker.js.
name = "planes-above-me"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Run the tests before every deploy: if they fail, nothing is published.
[build]
command = "npm test"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/over/*"]

# Free database for stats, the leaderboard and error reports.
[[d1_databases]]
binding = "DB"
database_name = "planes-above-me"
database_id = "4c2c7b06-760c-4da4-8807-67090bcc8d96"
migrations_dir = "migrations"

# Keep Worker logs (including browser error reports) in the Cloudflare dashboard.
[observability]
enabled = true
